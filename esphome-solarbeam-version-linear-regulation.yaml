esphome:
  name: esphome-web-ab7e4c
  friendly_name: SOLARBEAM EMS NG - 1
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    priority: -10
    then:
      # Po startu zapneme SSR na úroveň 0
      - output.turn_on: ssr
      - output.set_level:
          id: ssr
          level: 0.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

web_server:
  port: 80

## Muze byt aktivni POUZE ethernet, nebo WIFI rozhrani, NE OBOJI!

